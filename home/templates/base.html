<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Marketplace{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #17181a;
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        .container {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid #e5e7eb;
            backdrop-filter: blur(12px);
        }

        .navbar-inner {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 10px 12px;
            border-radius: 10px;
            color: #555b66;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-link:hover {
            background: #f0f2f5;
            color: #111827;
        }

        .nav-button {
            border: 0;
            background: #111827;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        .page {
            padding: 35px 0 60px;
        }

        .hero {
            background: linear-gradient(135deg, #111827, #2563eb);
            color: white;
            border-radius: 24px;
            padding: 42px;
            margin-bottom: 28px;
        }

        .hero h1 {
            margin: 0 0 10px;
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.05;
        }

        .hero p {
            margin: 0;
            color: #dbeafe;
            max-width: 650px;
            line-height: 1.6;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin: 28px 0 18px;
        }

        .section-header h2 {
            margin: 0;
            font-size: 24px;
        }

        .search-box {
            background: white;
            padding: 18px;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            margin-bottom: 28px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr auto;
            gap: 10px;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #d9dde3;
            border-radius: 11px;
            background: white;
            padding: 12px 13px;
            outline: none;
            color: #111827;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 14px;
        }

        form p {
            margin: 0 0 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 42px;
            padding: 10px 16px;
            border: 0;
            border-radius: 11px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-dark {
            background: #111827;
            color: white;
        }

        .btn-light {
            background: #eef1f5;
            color: #222831;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-full {
            width: 100%;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .post-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            overflow: hidden;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.09);
        }

        .post-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
            background: #eef1f5;
        }

        .post-placeholder {
            height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef1f5;
            color: #9ca3af;
            font-size: 42px;
        }

        .post-content {
            padding: 16px;
        }

        .post-title {
            margin: 0 0 9px;
            font-size: 17px;
            line-height: 1.35;
        }

        .price {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            color: #6b7280;
            font-size: 13px;
        }

        .tag {
            display: inline-flex;
            background: #f0f2f5;
            padding: 5px 8px;
            border-radius: 7px;
        }

        .empty {
            background: white;
            border: 1px dashed #d1d5db;
            border-radius: 18px;
            padding: 45px 20px;
            text-align: center;
            color: #6b7280;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.04);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 18px;
            color: #4b5563;
            font-weight: 600;
        }

        .back-link:hover {
            color: #2563eb;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
            gap: 30px;
            align-items: start;
        }

        .detail-image {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
            border-radius: 18px;
            background: #eef1f5;
        }

        .detail-title {
            margin: 0 0 12px;
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1.1;
        }

        .detail-price {
            font-size: 30px;
            font-weight: 800;
            margin: 18px 0;
        }

        .detail-description {
            color: #555b66;
            line-height: 1.7;
            white-space: pre-line;
        }

        .info-list {
            display: grid;
            gap: 10px;
            margin: 20px 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid #edf0f3;
        }

        .info-row span:first-child {
            color: #737983;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .profile-head {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 24px;
            align-items: center;
            margin-bottom: 25px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: #eef1f5;
            border: 4px solid white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .avatar-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        .profile-name {
            margin: 0 0 7px;
            font-size: 30px;
        }

        .profile-bio {
            color: #666d78;
            line-height: 1.6;
        }

        .list {
            display: grid;
            gap: 14px;
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 15px;
        }

        .list-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            object-fit: cover;
            background: #eef1f5;
            flex-shrink: 0;
        }

        .list-main {
            flex: 1;
            min-width: 0;
        }

        .list-main h3 {
            margin: 0 0 5px;
        }

        .list-main p {
            margin: 3px 0;
            color: #6b7280;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-box {
            max-width: 850px;
            margin: 0 auto;
        }

        .message {
            padding: 13px 15px;
            border-radius: 15px;
            margin-bottom: 12px;
            background: #f0f2f5;
        }

        .message.mine {
            background: #dbeafe;
        }

        .message-head {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 7px;
            font-size: 13px;
        }

        .message-text {
            line-height: 1.5;
            white-space: pre-line;
        }

        .auth-wrapper {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            width: min(460px, 100%);
        }

        .auth-card h1 {
            margin-top: 0;
        }

        .footer {
            text-align: center;
            color: #8a919c;
            padding: 30px 0;
            font-size: 13px;
        }

        @media (max-width: 1050px) {
            .posts-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .search-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 760px) {
            .container {
                width: min(100% - 20px, 680px);
            }

            .navbar-inner {
                padding: 10px 0;
                align-items: flex-start;
                flex-direction: column;
            }

            .nav-links {
                width: 100%;
                justify-content: flex-start;
            }

            .nav-link,
            .nav-button {
                font-size: 13px;
                padding: 8px 10px;
            }

            .page {
                padding-top: 20px;
            }

            .hero {
                padding: 28px 22px;
                border-radius: 18px;
            }

            .search-grid {
                grid-template-columns: 1fr;
            }

            .posts-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .post-image,
            .post-placeholder {
                height: 170px;
            }

            .post-content {
                padding: 13px;
            }

            .post-title {
                font-size: 15px;
            }

            .price {
                font-size: 17px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .detail-title {
                font-size: 29px;
            }

            .profile-head {
                grid-template-columns: 1fr;
                text-align: center;
                justify-items: center;
            }

            .actions {
                flex-direction: column;
            }

            .actions .btn {
                width: 100%;
            }

            .list-item {
                align-items: flex-start;
            }
        }

        @media (max-width: 430px) {
            .posts-grid {
                grid-template-columns: 1fr;
            }

            .post-image,
            .post-placeholder {
                height: 220px;
            }

            .section-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">
    <div class="container navbar-inner">

        <a href="{% url 'home' %}" class="logo">
            Market<span>Place</span>
        </a>

        <nav class="nav-links">

            <a href="{% url 'home' %}" class="nav-link">
                🏠 Главная
            </a>

            {% if user.is_authenticated %}

                <a href="{% url 'post_create' %}" class="nav-link">
                    ➕ Создать
                </a>

                <a href="{% url 'favorite_list' %}" class="nav-link">
                    ❤️ Избранное
                </a>

                <a href="{% url 'message_list' %}" class="nav-link">
                    💬 Сообщения
                </a>

                <a href="{% url 'notification_list' %}" class="nav-link">
                    🔔 Уведомления
                </a>

                <a href="{% url 'profile_detail' %}" class="nav-link">
                    👤 Профиль
                </a>

                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="nav-button">
                        Выйти
                    </button>
                </form>

            {% else %}

                <a href="{% url 'login' %}" class="nav-link">
                    Войти
                </a>

                <a href="{% url 'registeruser' %}" class="btn btn-primary">
                    Регистрация
                </a>

            {% endif %}

        </nav>

    </div>
</header>

<main class="page">
    <div class="container">

        {% block content %}
        {% endblock %}

    </div>
</main>

<footer class="footer">
    Marketplace
</footer>

</body>
</html>
