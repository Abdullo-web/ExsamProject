<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>

    <h1>Главная страница</h1>

    {% if user.is_authenticated %}

        <a href="{% url 'profile_detail' %}">
            <button type="button">Profile</button>
        </a>

    {% else %}

        <a href="{% url 'login' %}">
            Войти
        </a>

        <a href="{% url 'registeruser' %}">
            Регистрация
        </a>

    {% endif %}



    <h2>Все посты</h2>

    {% for post in posts %}

        <div>

            <h3>
                <a href="{% url 'post_detail' post.pk %}">
                    {{ post.title }}
                </a>
            </h3>

            <p>
                Опубликовано:
                {{ post.cr_at|date:"d.m.Y H:i" }}
            </p>

        </div>

        <hr>


    {% endfor %}



</body>
</html>
