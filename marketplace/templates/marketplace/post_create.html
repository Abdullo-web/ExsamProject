<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать объявление — MarketPlace</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'marketplace/style.css' %}">
</head>
<body>

<header class="site-header">
    <div class="container header-inner">
        <a href="{% url 'home' %}" class="logo">
            Market<span>Place</span>
        </a>

        <nav class="nav">
            <a href="{% url 'home' %}">Главная</a>
            <a href="{% url 'favorite_list' %}">
                ❤️ Избранное
                <span class="badge">{{ user.favorites_user.count }}</span>
            </a>
            <a href="{% url 'message_list' %}">💬 Сообщения</a>
            <a href="{% url 'notification_list' %}">🔔 Уведомления</a>

            {% if user.profile_user %}
                <a href="{% url 'profile_detail' %}">Профиль</a>
            {% else %}
                <a href="{% url 'profile_create' %}">Создать профиль</a>
            {% endif %}
        </nav>
    </div>
</header>

<main class="page">
    <div class="container">

        <div class="back-button">
            <button
                type="button"
                class="button button-light"
                onclick="if (document.referrer) { history.back(); } else { window.location.href='{% url 'home' %}'; }"
            >
                ← Назад
            </button>
        </div>

        <div class="card form-card">

            <h1>Создать объявление</h1>

            <p>
                Добавьте товар или услугу, которую хотите продать.
            </p>

            <form method="post" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="form-actions">

                    <button
                        type="submit"
                        class="button button-primary"
                    >
                        Опубликовать объявление
                    </button>

                    <button
                        type="button"
                        class="button button-light"
                        onclick="if (document.referrer) { history.back(); } else { window.location.href='{% url 'home' %}'; }"
                    >
                        Отмена
                    </button>

                </div>

            </form>

        </div>

    </div>
</main>

</body>
</html>
