<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Post</title>
</head>
<body>

    <h1>Delete Post</h1>

    <p>
        Вы точно хотите удалить:
        <strong>{{ object.title }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>
    </form>

    <br>

    <a href="{% url 'post_detail' object.pk %}">
        <button type="button">
            Cancel
        </button>
    </a>

</body>
</html>
