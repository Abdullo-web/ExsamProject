<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удаление объявления — MarketPlace</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'marketplace/style.css' %}">
</head>
<body>

<header class="site-header">
    <div class="container header-inner">

        <a href="{% url 'home' %}" class="logo">
            Market<span>Place</span>
        </a>

        <nav class="nav">
            <a href="{% url 'home' %}">Главная</a>
            <a href="{% url 'profile_detail' %}">Профиль</a>
        </nav>

    </div>
</header>

<main class="page">

    <div class="container">

        <div class="card confirm-card">

            <h1>Удалить объявление?</h1>

            <p>
                Вы действительно хотите удалить объявление
                <strong>«{{ object.title }}»</strong>?
            </p>

            <p>
                После удаления восстановить его будет невозможно.
            </p>

            <form method="post">

                {% csrf_token %}

                <div class="form-actions" style="justify-content:center;">

                    <button
                        type="submit"
                        class="button button-danger"
                    >
                        🗑 Да, удалить
                    </button>

                    <button
                        type="button"
                        class="button button-light"
                        onclick="if (document.referrer) { history.back(); } else { window.location.href='{% url 'post_detail' object.pk %}'; }"
                    >
                        Отмена
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>

</body>
</html>
