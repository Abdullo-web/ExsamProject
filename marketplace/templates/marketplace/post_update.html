<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Update Post</title>
</head>
<body>

<h1>Update Post</h1>

<form method="post" enctype="multipart/form-data">
{% csrf_token %}

{{ form.as_p }}

<button type="submit">Save Changes</button>
</form>

<br>

<a href="{% url 'post_detail' object.pk %}">
<button type="button">Cancel</button>
</a>

</body>
</html>
